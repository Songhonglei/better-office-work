# 注意：本文件只是示例与旧版兜底，不是配置真源。
# 真源是 ~/.workbuddy/oss-pages-sync/config.json 的 sites 数组；
# run.py 会据此生成 runtime/sites.conf，ci setup 会据此生成仓库里的 sites.conf。
# 目录名 | 已发布的站点根 URL | 可选 root=1
# 第三列 root=1 表示源站用根绝对路径（/v2/…、/_next/…），需改写成 /<目录名>/…
# 一行一个站点；URL 可用任意可访问的静态站根地址，不限于 GitHub Pages
