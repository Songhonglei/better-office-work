<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连环画审图</title>
  <link rel="stylesheet" href="/workbench.css">
  <script defer src="/workbench.js"></script>
</head>
<body>
  <header class="mast">
    <div><p>整册审图</p><h1 id="book-title">连环画审图</h1></div>
    <a id="reader" hidden>查看阅读试排 <span aria-hidden="true">↗</span></a>
  </header>
  <nav class="work-tabs" id="work-tabs" aria-label="审图导航" hidden>
    <div>
      <button type="button" data-jump="page-title">逐页审图</button>
      <button type="button" data-jump="continuity">跨页对照</button>
      <button type="button" data-jump="rework">返工队列 <span id="queue-count"></span></button>
      <button type="button" id="next-to-review">下一处待审</button>
    </div>
  </nav>
  <p id="notice" role="status" class="notice" hidden></p>
  <main id="workspace" hidden>
    <nav class="rail" aria-label="整册页目">
      <h2>页目 <span id="page-count"></span></h2>
      <select id="page-filter" aria-label="筛选页目">
        <option value="all">全部页面</option><option value="notes">有待处理批注</option>
        <option value="working">正在返工</option><option value="candidate">有候选待审</option>
      </select>
      <div id="page-list" class="page-list"></div>
    </nav>
    <div class="desk">
      <section class="editor" aria-labelledby="page-title">
        <div class="page-heading">
          <h2 id="page-title"></h2>
          <div class="page-nav"><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button></div>
        </div>
        <div class="versions">
          <label for="version">查看版本</label><select id="version"></select>
          <button id="keep" type="button">设为审图稿</button>
          <label class="compare-toggle"><input type="checkbox" id="compare"> 并排对照</label>
        </div>
        <div id="comparison-controls" class="comparison-controls" hidden>
          <label for="compared-version">对照版本</label><select id="compared-version"></select>
        </div>
        <div class="region-toolbar" id="region-toolbar" hidden>
          <button type="button" id="toggle-region">看整幅</button><span id="candidate-note"></span>
        </div>
        <div class="page-work" id="page-work">
          <div class="proof">
            <div id="artwork" class="artwork">
              <figure id="main-proof" class="page-proof">
                <div id="position" class="image-position">
                  <img id="art" alt="" class="proof-image">
                  <div id="pins" class="pins" aria-hidden="true"></div>
                </div>
                <figcaption id="art-label"></figcaption>
              </figure>
              <figure class="page-proof" id="comparison-proof" hidden>
                <img id="comparison-art" alt="" class="proof-image">
                <figcaption id="comparison-label"></figcaption>
              </figure>
            </div>
            <p id="draft-caption" class="draft-caption"></p>
          </div>
          <aside class="annotations" aria-labelledby="annotation-title">
            <h3 id="annotation-title">本稿批注 <span id="annotation-count"></span></h3>
            <form id="note-form">
              <label for="note-detail">关联细节</label>
              <select id="note-detail"></select>
              <label for="message">批注</label>
              <textarea id="message" rows="3" maxlength="2000" required placeholder="记录问题或核对结果"></textarea>
              <div class="note-actions">
                <button id="pick-pin" type="button" aria-pressed="false">在画面上标点</button>
                <button id="save-note" type="submit" class="primary">保存批注</button>
              </div>
              <p id="pin-hint" class="pin-hint" hidden></p>
            </form>
            <ol id="notes" class="notes"></ol>
          </aside>
        </div>
      </section>
      <section id="continuity" class="continuity" aria-labelledby="continuity-title" hidden>
        <div class="detail-heading"><h2 id="continuity-title">跨页细节对照</h2><label for="detail">选择细节</label><select id="detail"></select></div>
        <p id="detail-rule" hidden></p>
        <div id="detail-pages" class="detail-pages"></div>
      </section>
      <section id="rework" class="continuity" aria-labelledby="rework-title">
        <div class="detail-heading"><h2 id="rework-title">返工队列</h2><button id="run-rework" type="button" class="primary">运行下一项</button></div>
        <p id="rework-status" aria-live="polite"></p>
        <ol id="rework-tasks"></ol>
      </section>
    </div>
  </main>
  <dialog id="rework-dialog" aria-labelledby="rework-dialog-title">
    <form id="rework-form">
      <div class="dialog-heading"><h2 id="rework-dialog-title">加入返工队列</h2><button id="close-rework" type="button">关闭</button></div>
      <p id="origin-note"></p>
      <div class="dialog-controls">
        <label>修改范围 <select id="rework-scope"><option value="local">局部修订</option><option value="page">整页重画</option></select></label>
        <label>模型 <select id="rework-preset"><option value="qwen-q4">Q4</option><option value="qwen-q6">Q6</option></select></label>
      </div>
      <div id="region-picker">
        <p id="region-status" role="status">在图上拖动，框住要修改的部分。</p>
        <div id="region-target"><img id="region-image" alt="批注对应的原稿" draggable="false"><div id="region-box" hidden></div></div>
        <button type="button" id="clear-region">重选范围</button>
      </div>
      <button type="submit" id="add-rework-confirm" class="primary">加入队列</button>
    </form>
  </dialog>
</body>
</html>
