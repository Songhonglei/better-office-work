name: QQ Mail Manage offline checks

on:
  push:
    branches: [main]
    paths:
      - skills/qq-mail-manage/**
      - .github/workflows/qq-mail-manage-tests.yml
  pull_request:
    paths:
      - skills/qq-mail-manage/**
      - .github/workflows/qq-mail-manage-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install modern MCP schema dependencies
        working-directory: skills/qq-mail-manage
        run: python3 -m pip install -r requirements.txt
      - name: Run without real mailbox credentials
        working-directory: skills/qq-mail-manage
        run: python3 -m unittest discover -s tests -v
