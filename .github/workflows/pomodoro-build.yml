name: Build Pomodoro Timer

on:
  push:
    branches: [main]
    paths:
      - 'tools/Pomodoro Timer/index.html'
      - 'tools/Pomodoro Timer/main.swift'
      - 'tools/Pomodoro Timer/Info.plist'
      - 'tools/Pomodoro Timer/build.sh'
      - '.github/workflows/pomodoro-build.yml'
  workflow_dispatch:

concurrency:
  group: pomodoro-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python + Pillow (icon generation)
        run: |
          python3 -m venv /tmp/pomo-venv
          /tmp/pomo-venv/bin/pip install --quiet pillow
          echo "/tmp/pomo-venv/bin" >> "$GITHUB_PATH"

      - name: Build standalone HTML + macOS app
        run: |
          cd "tools/Pomodoro Timer"
          ./build.sh

      - name: Stage Pages artifact (index.html only)
        run: |
          mkdir -p /tmp/pomo-pages
          cp "tools/Pomodoro Timer/dist/index.html" /tmp/pomo-pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pomo-pages

      - name: Commit rebuilt artifacts (only when changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tools/Pomodoro Timer/dist" "tools/Pomodoro Timer/icon.png"
          if git diff --cached --quiet; then
            echo "dist unchanged, nothing to commit"
          else
            git commit -m "chore(tools): rebuild Pomodoro Timer dist [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
